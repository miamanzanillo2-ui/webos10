<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WebOS 10</title>
<style>
:root{--bg1:#0b5cab;--bg2:#12b5cb;--glass:rgba(243,246,250,.82);--ink:#1b2430;--muted:#5d6b7c;--line:rgba(0,0,0,.12);--win:#fff;--accent:#0a64d0;--hover:rgba(0,0,0,.07);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#10204a;--bg2:#2a6f8f;--glass:rgba(30,34,44,.85);--ink:#eef2f7;--muted:#9aa7b8;--line:rgba(255,255,255,.14);--win:#262b36;--accent:#4a9dff;--hover:rgba(255,255,255,.1)}}
:root[data-theme="dark"]{--bg1:#10204a;--bg2:#2a6f8f;--glass:rgba(30,34,44,.85);--ink:#eef2f7;--muted:#9aa7b8;--line:rgba(255,255,255,.14);--win:#262b36;--accent:#4a9dff;--hover:rgba(255,255,255,.1)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;color:var(--ink);background:#0b5cab;user-select:none}
#desk{position:fixed;inset:0;padding-top:env(safe-area-inset-top,0px);background:radial-gradient(60% 70% at 25% 30%,rgba(255,255,255,.35),transparent 60%),radial-gradient(50% 60% at 80% 80%,rgba(0,40,120,.45),transparent 65%),linear-gradient(135deg,var(--bg1),var(--bg2))}
#icons{display:grid;grid-template-columns:repeat(auto-fill,84px);grid-auto-rows:92px;grid-auto-flow:column;grid-template-rows:repeat(auto-fill,92px);height:calc(100% - 50px);padding:10px;gap:4px;align-content:start}
.ico{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px;border-radius:6px;color:#fff;font-size:12px;text-align:center;text-shadow:0 1px 3px rgba(0,0,0,.6);cursor:default;border:1px solid transparent}
.ico:hover,.ico:focus{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.3);outline:none}
.ico .g{font-size:30px;line-height:1.1}
.win{position:absolute;background:var(--win);border-radius:9px;box-shadow:0 12px 40px rgba(0,0,0,.35),0 0 0 1px var(--line);display:flex;flex-direction:column;overflow:hidden;min-width:260px;min-height:160px;resize:both}
.win.max{inset:0 0 48px 0!important;width:auto!important;height:auto!important;border-radius:0;resize:none}
.win.min{display:none}
.tb{display:flex;align-items:center;height:38px;padding-left:12px;background:var(--glass);border-bottom:1px solid var(--line);touch-action:none;cursor:default;flex:none}
.tb .t{flex:1;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb button{width:46px;height:38px;border:0;background:none;color:var(--ink);font-size:14px;cursor:default}
.tb button:hover{background:var(--hover)}.tb .x:hover{background:#e5322d;color:#fff}
.body{flex:1;overflow:auto;position:relative;user-select:text}
#bar{position:fixed;left:0;right:0;bottom:0;height:calc(48px + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);background:var(--glass);backdrop-filter:blur(22px);border-top:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:4px;z-index:9999}
.tbtn{height:38px;min-width:42px;padding:0 10px;border:0;border-radius:6px;background:none;color:var(--ink);font-size:20px;position:relative;display:flex;align-items:center;gap:6px;cursor:default}
.tbtn:hover{background:var(--hover)}
.tbtn span{font-size:12px;max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbtn.on::after{content:"";position:absolute;left:30%;right:30%;bottom:1px;height:3px;border-radius:2px;background:var(--muted)}
.tbtn.act::after{background:var(--accent);left:20%;right:20%}
#clock{position:absolute;right:12px;font-size:12px;text-align:right;line-height:1.3;color:var(--ink)}
#start{position:fixed;left:50%;bottom:calc(58px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(520px,calc(100% - 16px));background:var(--glass);backdrop-filter:blur(26px);border:1px solid var(--line);border-radius:12px;box-shadow:0 16px 50px rgba(0,0,0,.4);padding:18px;z-index:9998;display:none}
#start.open{display:block}
#start h3{margin:0 0 10px;font-size:13px;font-weight:600;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.app{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:8px;border:0;background:none;color:var(--ink);font:inherit;font-size:12px;cursor:default}
.app:hover{background:var(--hover)}.app .g{font-size:28px}
.pw{display:flex;justify-content:space-between;align-items:center;margin-top:16px;padding-top:12px;border-top:1px solid var(--line);font-size:13px}
.pw button{border:0;background:var(--hover);color:var(--ink);padding:7px 12px;border-radius:6px;font:inherit;font-size:12px}
/* apps */
textarea.np{width:100%;height:100%;border:0;resize:none;padding:10px;font:14px/1.5 Consolas,"Courier New",monospace;background:var(--win);color:var(--ink);outline:none}
.calc{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:8px;height:100%;grid-template-rows:auto repeat(5,1fr)}
.calc .scr{grid-column:1/-1;text-align:right;font-size:34px;padding:10px 6px;overflow:hidden;min-height:60px;user-select:text}
.calc button{border:0;border-radius:6px;background:var(--hover);color:var(--ink);font:inherit;font-size:18px;min-height:40px}
.calc button:hover{filter:brightness(1.15)}.calc .op{background:rgba(10,100,208,.16)}.calc .eq{background:var(--accent);color:#fff}
.fx{display:flex;height:100%;font-size:13px}.fx aside{width:150px;border-right:1px solid var(--line);padding:8px;flex:none}
.fx aside div,.fx .it{padding:7px 10px;border-radius:6px;cursor:default}.fx aside div:hover,.fx .it:hover{background:var(--hover)}.fx aside .sel{background:var(--hover);font-weight:600}
.fx main{flex:1;padding:8px;overflow:auto}.fx .it{display:flex;gap:10px;align-items:center}.fx .it small{margin-left:auto;color:var(--muted)}
.set{padding:16px;font-size:14px;display:grid;gap:14px}.set label{display:flex;justify-content:space-between;align-items:center;gap:12px}
.set select,.set input{font:inherit;padding:6px 8px;border-radius:6px;border:1px solid var(--line);background:var(--win);color:var(--ink)}
canvas.pt{display:block;background:#fff;cursor:crosshair;touch-action:none}
.ptb{display:flex;gap:8px;padding:6px 8px;border-bottom:1px solid var(--line);align-items:center;font-size:13px}
.term{background:#0c0f14;color:#b8f5c8;height:100%;padding:10px;font:13px/1.5 Consolas,monospace;overflow:auto;white-space:pre-wrap}
.term input{background:none;border:0;outline:0;color:inherit;font:inherit;width:70%}
@media (prefers-reduced-motion:no-preference){.win{animation:pop .14s ease-out}@keyframes pop{from{transform:scale(.96);opacity:0}}}
/* Windows 10 look */
#desk{background:radial-gradient(70% 90% at 72% 50%,rgba(70,180,255,.6),transparent 65%),linear-gradient(135deg,#041a3d,#0b5cab 55%,#1e90ff)}
#bar{justify-content:flex-start;height:calc(40px + env(safe-area-inset-bottom,0px));background:rgba(20,20,22,.95);border-top:0;gap:0}
#tasks{gap:0!important}
.tbtn{height:40px;border-radius:0;color:#fff;min-width:48px;justify-content:center}
.tbtn:hover{background:rgba(255,255,255,.18)}
.tbtn span{display:none}
.tbtn.on{background:rgba(255,255,255,.08)}.tbtn.act{background:rgba(255,255,255,.2)}
.tbtn.on::after,.tbtn.act::after{left:0;right:0;bottom:0;height:2px;border-radius:0;background:#76b9ed}
#clock{color:#fff}
.win{border-radius:0;border:1px solid #8a8a8a;box-shadow:0 8px 32px rgba(0,0,0,.4)}
.win.foc{border-color:var(--accent)}
.win.max{inset:0 0 calc(40px + env(safe-area-inset-bottom,0px)) 0!important;border:0}
.tb{height:32px;background:var(--win);border-bottom:0}
.tb button{height:32px;width:46px}
.tb .x:hover{background:#e81123}
#start{left:0;transform:none;bottom:calc(40px + env(safe-area-inset-bottom,0px));width:min(340px,100%);border-radius:0;border:0;background:rgba(28,28,32,.97);color:#fff;--ink:#fff;--muted:#bbb;--hover:rgba(255,255,255,.15);--line:rgba(255,255,255,.2)}
.grid{grid-template-columns:repeat(3,1fr);gap:4px}
.app{background:var(--accent);border-radius:0;height:92px;justify-content:center;color:#fff}
.app:hover{background:var(--accent);outline:2px solid rgba(255,255,255,.6)}
#start{max-height:75vh;overflow:auto}
.b2{border:0;background:var(--hover);color:var(--ink);padding:7px 12px;font:inherit;font-size:13px;cursor:default}.b2:hover{filter:brightness(1.2)}
.nt{border:0;border-bottom:1px solid var(--line);padding:10px;font:600 15px "Segoe UI",system-ui,sans-serif;background:var(--win);color:var(--ink);outline:0}
.sq{display:grid;grid-template-columns:52px repeat(16,1fr);gap:3px;padding:8px;align-items:center;font-size:12px}.sq i{font-style:normal}
.sq button{height:30px;min-width:0;border:0;border-radius:2px;background:var(--hover);padding:0}.sq button.q{background:rgba(128,128,128,.3)}.sq button.on{background:var(--accent)}.sq button.pl{outline:2px solid var(--ink);outline-offset:-2px}
.tp{display:flex;gap:12px;align-items:center;padding:8px;border-bottom:1px solid var(--line);font-size:13px}
.wx{padding:14px;font-size:14px}.wr{display:flex;gap:6px}.wr input{flex:1;font:inherit;padding:6px;border:1px solid var(--line);background:var(--win);color:var(--ink)}
.wb{font-size:48px;margin:6px 0}.wd{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;text-align:center;margin-top:16px;font-size:12px}
.sw{text-align:center;padding:14px}.ck{font-size:28px}.st{font:300 44px "Segoe UI",system-ui,sans-serif;margin:12px 0}
.dp{display:flex;gap:6px;justify-content:center;margin-top:8px}

.wd2{display:flex;flex-direction:column;height:100%}
.wt{display:flex;flex-wrap:wrap;gap:4px;padding:6px;border-bottom:1px solid var(--line);flex:none}
.wt button,.wt select{border:0;background:var(--hover);color:var(--ink);padding:6px 10px;font:inherit;font-size:13px;cursor:default}
.wp{flex:1;overflow:auto;background:#d9d9d9;padding:14px}
.pg{background:#fff;color:#222;min-height:100%;padding:30px;outline:0;font:15px/1.6 Calibri,"Segoe UI",sans-serif;user-select:text}
.wc{flex:none;padding:4px 10px;font-size:12px;color:var(--muted);border-top:1px solid var(--line)}
.wt{align-items:center;overflow-x:auto}.wt button,.wt select{padding:5px 8px;font-size:12px;white-space:nowrap}
.wti{width:120px;font:inherit;font-size:12px;padding:5px;border:1px solid var(--line);background:var(--win);color:var(--ink)}
.cl{position:relative;display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:28px;background:var(--hover);font-size:13px}.cl input{position:absolute;inset:0;width:100%;height:100%;opacity:0}
.pg img{max-width:100%}.pg a{color:#0a64d0}.pg h1{font-size:26px;margin:.3em 0}.pg ul,.pg ol{padding-left:26px}
.bs{display:flex;flex-direction:column;height:100%;outline:0;background:#0b1020;color:#e6edf7;font-size:12px;user-select:none}
.bst{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px;border-bottom:1px solid rgba(255,255,255,.1)}
.bst label{display:flex;gap:6px;align-items:center;color:#9fb0c8}.bst select{background:#1e293b;color:#e6edf7;border:1px solid #334155;padding:4px;font:inherit}
.bs .b2{background:#1e293b;color:#e6edf7}.bs .b2.rec{background:#e11d48}
.bsm{flex:1;overflow:auto;display:flex;flex-wrap:wrap;gap:12px;padding:10px;align-content:flex-start}
.bsl{flex:1 1 240px;min-width:220px}.bsr{flex:2 1 420px;min-width:380px}
.vz{width:100%;height:70px;background:#020617;border:1px solid rgba(255,255,255,.1);display:block}
.pads{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.pad{height:58px;border:1px solid var(--c);background:#111a30;color:#fff;font:inherit;font-weight:700;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;padding:6px;cursor:default}.pad small{color:var(--c);font-family:monospace}.pad.hit{background:var(--c);color:#000}.pad.hit small{color:#000}
.hint{color:#6b7c95;margin:8px 0 0}
.bsrow{display:flex;align-items:center;gap:6px;margin-bottom:5px}.bsrow>span{width:62px;font-weight:600;flex:none}
.steps{display:grid;grid-template-columns:repeat(16,1fr);gap:3px;flex:1}
.st{height:24px;min-width:0;padding:0;border:1px solid #1e293b;background:#0f172a;cursor:default}.st.q{background:#1b2740}.st.on{background:var(--c);border-color:var(--c)}.st.cur{outline:2px solid #fff;outline-offset:-2px}
.bss{padding:4px 10px;border-top:1px solid rgba(255,255,255,.1);color:#9fb0c8}
.ob{display:flex;flex-direction:column;height:100%;background:#18181c;color:#d4d4d8;font-size:12px;user-select:none;position:relative}
.ob select,.ob input[type=number]{background:#18181b;color:#e4e4e7;border:1px solid #3f3f46;padding:3px;font:inherit}
.obp{flex:1;min-height:0;position:relative;padding:10px;background-color:#0d0d11;background-image:radial-gradient(#27272a 1px,transparent 0);background-size:16px 16px}
.obp canvas{width:100%;height:100%;object-fit:contain;background:#000;display:block;border:2px solid rgba(239,68,68,.8)}
.obb{position:absolute;top:20px;left:20px;display:flex;gap:6px}.obb span{background:rgba(220,38,38,.9);color:#fff;font:10px monospace;padding:2px 6px}.obb .lb{background:#059669}.obb span[hidden]{display:none}
.obi{position:absolute;right:20px;bottom:20px;background:rgba(0,0,0,.6);color:#a1a1aa;font:10px monospace;padding:3px 6px}.obi b{color:#60a5fa}
.obd{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px;padding:6px;height:190px;overflow:auto;background:#121215;border-top:1px solid #27272a;flex:none}
.obk{background:#1a1a1e;border:1px solid #27272a;display:flex;flex-direction:column;min-height:0}.obk h4{margin:0;padding:4px 8px;background:#222226;font-size:11px;font-weight:600}.obk .bd{flex:1;overflow:auto;padding:4px}
.ob .it{padding:5px 8px;cursor:default;display:flex;justify-content:space-between;border-radius:0}.ob .it:hover{background:#27272a}.ob .it.sel{background:rgba(59,130,246,.3);color:#bfdbfe}
.obf{display:flex;justify-content:space-around;padding:3px;background:#161619;border-top:1px solid #27272a;color:#71717a;font-size:10px}.obf button{background:none;border:0;color:#a1a1aa;cursor:default;padding:2px 8px}
.ch{margin-bottom:8px}.mt{height:8px;background:#18181b;border:1px solid #27272a;overflow:hidden;margin:3px 0}.mt i{display:block;height:100%;width:50%;background:linear-gradient(90deg,#10b981,#fbbf24,#e11d48);transition:width .08s}

$("#sgrid").innerHTML=ids.map(i=>`<button class="app" data-a="${i}"><span class="g">${apps[i].g}</span>${apps[i].n}</button>`).join("");
document.querySelectorAll(".ico").forEach(e=>{e.ondblclick=()=>open(e.dataset.a);e.onkeydown=k=>k.key=="Enter"&&open(e.dataset.a)});
document.querySelectorAll(".app").forEach(e=>e.onclick=()=>open(e.dataset.a));
const q=document.getElementById("sq");if(q&&q.value){q.value="";q.dispatchEvent(new Event("input"))}}
shell();
$("#sb").onclick=e=>{e.stopPropagation();$("#start").classList.toggle("open")};
desk.addEventListener("pointerdown",()=>$("#start").classList.remove("open"));
$("#reset").onclick=()=>{wins.forEach((v,w)=>{w.remove();v.tbtn.remove()});wins.clear();$("#start").classList.remove("open")};
function tick(){const d=new Date();$("#clock").innerHTML=d.toLocaleTimeString([],{hour:"numeric",minute:"2-digit"})+"<br>"+d.toLocaleDateString()}tick();setInterval(tick,15000);
open("notepad");
(function(){const bt=document.getElementById("boot");if(!bt)return;let d=0;const end=()=>{if(d)return;d=1;bt.classList.add("off");removeEventListener("keydown",end);setTimeout(()=>bt.remove(),800)};bt.addEventListener("pointerdown",end);addEventListener("keydown",end);setTimeout(end,matchMedia("(prefers-reduced-motion:reduce)").matches?600:4200)})();
(function(){const lk=document.getElementById("lock"),T=lk.querySelector(".lt"),D=lk.querySelector(".ld");
try{lk.style.backgroundImage=getComputedStyle(document.getElementById("desk")).backgroundImage}catch(e){}
const up=()=>{const d=new Date();T.textContent=d.toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});D.textContent=d.toLocaleDateString([],{weekday:"long",month:"long",day:"numeric"})};up();setInterval(up,1000);
let locked=1;const un=()=>{if(!locked)return;locked=0;lk.classList.add("up");if(window.notify)setTimeout(()=>notify("WebOS 10","Welcome, "+store.get("webos-user","Guest")),900);document.removeEventListener("keydown",kd,true)};
const kd=e=>{if(locked&&!document.getElementById("boot")){e.preventDefault();e.stopPropagation();un()}};
lk.addEventListener("pointerdown",un);document.addEventListener("keydown",kd,true);
const lockNow=()=>{locked=1;lk.classList.remove("up");document.getElementById("start").classList.remove("open");document.addEventListener("keydown",kd,true)};
document.getElementById("lk").onclick=lockNow;window.lockNow=lockNow;
document.addEventListener("keydown",e=>{if(e.altKey&&e.key.toLowerCase()=="l"&&!locked){e.preventDefault();lockNow()}})})();
(function(){const st=document.getElementById("start"),q=document.getElementById("sq"),no=document.getElementById("sno"),S={get btns(){return[...document.querySelectorAll("#sgrid .app")]}};
const vis=()=>S.btns.filter(b=>b.style.display!="none");
const filt=()=>{const v=q.value.trim().toLowerCase();S.btns.forEach(b=>{b.style.display=!v||b.textContent.toLowerCase().includes(v)?"":"none";b.classList.remove("hit")});const m=vis();no.style.display=m.length?"none":"block";if(v&&m[0])m[0].classList.add("hit")};
const isOpen=()=>st.classList.contains("open");
const reset=()=>{q.value="";filt()};
new MutationObserver(()=>{if(isOpen()){reset();setTimeout(()=>q.focus(),30)}}).observe(st,{attributes:true,attributeFilter:["class"]});
q.oninput=filt;
q.onkeydown=e=>{const m=vis();if(e.key=="Enter"){e.preventDefault();const h=m.find(b=>b.classList.contains("hit"))||m[0];if(h)h.click()}
 else if(e.key=="ArrowDown"||e.key=="ArrowUp"||e.key=="ArrowRight"||e.key=="ArrowLeft"){e.preventDefault();let i=m.findIndex(b=>b.classList.contains("hit"));m.forEach(b=>b.classList.remove("hit"));const d=(e.key=="ArrowDown")?3:(e.key=="ArrowUp")?-3:(e.key=="ArrowRight")?1:-1;i=i<0?0:Math.max(0,Math.min(m.length-1,i+d));if(m[i])m[i].classList.add("hit")}};
document.addEventListener("keydown",e=>{if(e.key=="Escape"&&isOpen()){st.classList.remove("open")}
 else if((e.key=="Meta"||(e.ctrlKey&&e.key=="Escape"))&&!document.getElementById("lock")?.matches(":not(.up)")){e.preventDefault();st.classList.toggle("open")}});
})();
/* ===== personalization, tray, action center, context menus ===== */
var sysVol=1;
const DEFWALL=getComputedStyle(document.getElementById("desk")).backgroundImage;
const WALLS=[{id:"win",n:"Light beams",v:DEFWALL},
{id:"aurora",n:"Aurora",v:"radial-gradient(60% 80% at 20% 20%,rgba(120,255,200,.55),transparent 60%),radial-gradient(70% 90% at 85% 30%,rgba(120,120,255,.6),transparent 65%),linear-gradient(160deg,#071a2e,#0b3a4a 60%,#10264d)"},
{id:"sunset",n:"Sunset",v:"radial-gradient(circle at 50% 80%,rgba(255,225,160,.95) 0,rgba(255,170,90,.45) 12%,transparent 32%),linear-gradient(180deg,#1f1147 0%,#7b2d8e 38%,#e8567a 68%,#ffb36b 100%)"},
{id:"forest",n:"Forest",v:"radial-gradient(70% 60% at 75% 15%,rgba(190,255,200,.4),transparent 60%),linear-gradient(170deg,#06220f,#0f5132 55%,#1f7a4d)"},
{id:"midnight",n:"Midnight",v:"radial-gradient(1.5px 1.5px at 20% 30%,#fff,transparent),radial-gradient(1.5px 1.5px at 70% 20%,#fff,transparent),radial-gradient(1px 1px at 45% 65%,#fff,transparent),radial-gradient(1px 1px at 85% 75%,#fff,transparent),radial-gradient(1px 1px at 12% 80%,#fff,transparent),radial-gradient(circle at 70% 30%,#2a2a6a,#0a0a1f 60%,#000)"},
{id:"dunes",n:"Dunes",v:"linear-gradient(165deg,#f6d6a0,#e0a066 40%,#a85d3a 75%,#4a2a28)"},
{id:"graphite",n:"Graphite",v:"linear-gradient(135deg,#1c1c20,#3a3a42)"}];
const ACC=[["Default",""],["Blue","#0a64d0"],["Teal","#00a3a3"],["Green","#2e9e4f"],["Purple","#7a4bd1"],["Pink","#d6336c"],["Orange","#e8710a"]];
const curWall=()=>{const v=store.get("webos-wall","win");return WALLS.some(w=>w.id==v)?v:"win"};
function applyWall(){const w=WALLS.find(x=>x.id==curWall());document.getElementById("desk").style.backgroundImage=w.v;const l=document.getElementById("lock");if(l)l.style.backgroundImage=w.v}
function setWall(id){store.set("webos-wall",id);applyWall()}
const curAcc=()=>store.get("webos-accent","");
function applyAcc(){const c=curAcc();c?document.documentElement.style.setProperty("--accent",c):document.documentElement.style.removeProperty("--accent")}
function setAcc(c){store.set("webos-accent",c);applyAcc()}
function applyUser(){const u=store.get("webos-user","Guest"),a=document.getElementById("un2");if(a)a.textContent="👤 "+u;const l=document.querySelector("#lock .lu");if(l)l.textContent="Hello, "+u}
/* context menu */
let sysCM=null;
function ctxClose(){if(sysCM){sysCM.remove();sysCM=null}}
function ctxMenu(x,y,items){ctxClose();const m=document.createElement("div");m.id="ctx";items.forEach(it=>{if(!it){m.append(document.createElement("hr"));return}const k=document.createElement("button");k.textContent=it[0];k.onclick=()=>{ctxClose();it[1]()};m.append(k)});document.body.append(m);const r=m.getBoundingClientRect();m.style.left=Math.max(4,Math.min(x,innerWidth-r.width-4))+"px";m.style.top=Math.max(4,Math.min(y,innerHeight-r.height-44))+"px";sysCM=m}
document.addEventListener("pointerdown",e=>{if(sysCM&&!sysCM.contains(e.target))ctxClose()},true);
addEventListener("keydown",e=>{if(e.key=="Escape")ctxClose()});addEventListener("blur",ctxClose);
function refreshDesk(){const ic=document.getElementById("icons");ic.style.transition="none";ic.style.opacity=0;shell();requestAnimationFrame(()=>{ic.style.transition="opacity .25s";ic.style.opacity=1})}
function nextWall(){const i=(WALLS.findIndex(w=>w.id==curWall())+1)%WALLS.length;setWall(WALLS[i].id);notify("Personalization","Wallpaper: "+WALLS[i].n)}
document.getElementById("desk").addEventListener("contextmenu",e=>{if(e.target.closest(".win"))return;e.preventDefault();ctxMenu(e.clientX,e.clientY,[["🔄 Refresh",refreshDesk],["🖼️ Change wallpaper",nextWall],["🎨 Personalize",()=>open("set")],null,["⌨️ Open Terminal",()=>open("term")],["🔒 Lock",()=>window.lockNow&&window.lockNow()]])});
/* tray + action center */
const SYS=Object.assign({wifi:1,bt:1,air:0,night:0,dnd:0,save:0},jget("webos-qs",{}));
const NT=[];let sysUnread=0;
(function(){
const $id=i=>document.getElementById(i);
const ac=document.createElement("div");ac.id="ac";ac.setAttribute("role","dialog");ac.setAttribute("aria-label","Action Center");
ac.innerHTML='<div class="ah"><b>Notifications</b><button id="acl">Clear all</button></div><div id="nl"></div><div class="aq"></div><div class="as"><label>☀️ <input id="br" type="range" min="20" max="100" aria-label="Brightness"></label><label><span id="vi">🔊</span> <input id="vl" type="range" min="0" max="100" aria-label="Volume"></label></div>';
const dim=document.createElement("div");dim.id="dim";const warm=document.createElement("div");warm.id="warm";const toasts=document.createElement("div");toasts.id="toasts";
document.body.append(ac,dim,warm,toasts);
const isDark=()=>{const t=document.documentElement.dataset.theme;return t?t=="dark":matchMedia("(prefers-color-scheme:dark)").matches};
const saveQ=()=>store.set("webos-qs",JSON.stringify(SYS));
const acOpen=()=>ac.classList.contains("open");
let batt=null;
const NETS=[["WebOS-Home",1,4],["CoffeeShop_Guest",0,3],["Linksys_5G",1,2],["Neighbor_2.4",1,1],["Library_WiFi",0,2]];
const BTD=[["🎧","WebOS Headphones"],["⌨️","Wireless Keyboard"],["🖱️","Bluetooth Mouse"],["🔊","Portable Speaker"],["⌚","Smart Watch"]];
let netCur=store.get("webos-net","WebOS-Home"),netBusy="",btBusy="";
let btOn=jget("webos-btd",["WebOS Headphones"]);if(!Array.isArray(btOn))btOn=[];
const fly=document.createElement("div");fly.id="fly";ac.append(fly);
const bars=n=>"▂▄▆█".slice(0,n);
const netLine=()=>!SYS.wifi||SYS.air?"Off":navigator.onLine?(netBusy?"Connecting…":netCur||"Not connected"):"No internet";
const btLine=()=>!SYS.bt||SYS.air?"Off":btOn.length?btOn[0]+(btOn.length>1?" +"+(btOn.length-1):""):"Not connected";
let flyKind="";
const showFly=k=>{flyKind=k;fly.classList.add("open");fly.innerHTML="";
 const h=document.createElement("div");h.className="yh";const back=document.createElement("button");back.textContent="←";back.title="Back";back.onclick=()=>{fly.classList.remove("open");flyKind=""};
 const tt=document.createElement("b");tt.textContent=k=="wifi"?"Wi-Fi":"Bluetooth";const sw=document.createElement("button");const on=!!SYS[k]&&!SYS.air;sw.textContent=on?"On":"Off";if(on)sw.classList.add("on");
 sw.onclick=()=>{if(SYS.air){notify("Airplane mode","Turn off Airplane mode first");return}SYS[k]=SYS[k]?0:1;saveQ();rq();trayUpd();showFly(k)};
 h.append(back,tt,sw);fly.append(h);const l=document.createElement("div");l.className="yl";fly.append(l);
 if(!on){const e=document.createElement("div");e.className="ye";e.textContent=SYS.air?"Airplane mode is on":(k=="wifi"?"Wi-Fi is off":"Bluetooth is off");l.append(e);return}
 if(k=="wifi"){NETS.forEach(n=>{const b=document.createElement("button");b.className="yi"+(netCur==n[0]?" cur":"");
   const ic=document.createElement("span");ic.className="ic";ic.textContent="📶";const d=document.createElement("div");d.textContent=n[0];const sm=document.createElement("small");sm.textContent=(n[1]?"🔒 Secured":"Open")+" · "+bars(n[2]);d.append(sm);
   const st=document.createElement("em");st.textContent=netBusy==n[0]?"Connecting…":netCur==n[0]?"Connected":"";b.append(ic,d,st);
   b.onclick=()=>{if(netBusy)return;if(netCur==n[0]){netCur="";store.set("webos-net","");notify("Wi-Fi","Disconnected from "+n[0]);rq();trayUpd();showFly("wifi");return}
    netBusy=n[0];rq();showFly("wifi");setTimeout(()=>{netCur=n[0];netBusy="";store.set("webos-net",n[0]);notify("Wi-Fi","Connected to "+n[0]);rq();trayUpd();if(flyKind=="wifi")showFly("wifi")},1200)};l.append(b)})}
 else{BTD.forEach(dv=>{const c=btOn.includes(dv[1]);const b=document.createElement("button");b.className="yi"+(c?" cur":"");
   const ic=document.createElement("span");ic.className="ic";ic.textContent=dv[0];const d=document.createElement("div");d.textContent=dv[1];const sm=document.createElement("small");sm.textContent=c?"Connected":"Paired";d.append(sm);
   const st=document.createElement("em");st.textContent=btBusy==dv[1]?"Connecting…":c?"Disconnect":"Connect";b.append(ic,d,st);
   b.onclick=()=>{if(btBusy)return;const sv=()=>store.set("webos-btd",JSON.stringify(btOn));
    if(c){btOn=btOn.filter(x=>x!=dv[1]);sv();notify("Bluetooth",dv[1]+" disconnected");rq();showFly("bt");return}
    btBusy=dv[1];showFly("bt");setTimeout(()=>{btOn.push(dv[1]);btBusy="";sv();notify("Bluetooth","Connected to "+dv[1]);rq();if(flyKind=="bt")showFly("bt")},1100)};l.append(b)})}};

const trayUpd=()=>{const on=navigator.onLine;$id("tw").textContent=SYS.air?"✈️":(SYS.wifi&&on?"📶":"🚫");$id("tw").title=SYS.air?"Airplane mode":(on?"Network: "+(SYS.wifi&&netCur?netCur:"connected"):"Network: no internet");
 const v=sysVol;$id("tv").textContent=v==0?"🔇":v<.34?"🔈":v<.67?"🔉":"🔊";$id("vi").textContent=$id("tv").textContent;$id("tv").title="Volume: "+Math.round(v*100)+"%";
 $id("tb2").textContent=batt?(batt.charging?"🔌":batt.level<.2?"🪫":"🔋"):"🔋";$id("tb2").title=batt?"Battery: "+Math.round(batt.level*100)+"%"+(batt.charging?" (charging)":""):"Battery"};
if(navigator.getBattery)navigator.getBattery().then(b=>{batt=b;["levelchange","chargingchange"].forEach(e=>b.addEventListener(e,trayUpd));trayUpd()}).catch(()=>{});
const TILES=[["wifi","📶","Wi-Fi"],["bt","🔷","Bluetooth"],["air","✈️","Airplane mode"],["night","🌙","Night light"],["dnd","🔕","Focus assist"],["save","🔋","Battery saver"],["dark","🌓","Dark mode"],["set","⚙️","Settings"]];
const rq=()=>{const q=ac.querySelector(".aq");q.innerHTML="";TILES.forEach(t=>{const k=document.createElement("button");k.className="q";const on=t[0]=="dark"?isDark():t[0]=="set"?false:!!SYS[t[0]]&&!(t[0]=="wifi"&&SYS.air)&&!(t[0]=="bt"&&SYS.air);if(on)k.classList.add("on");
 const i=document.createElement("span");i.textContent=t[1];const l=document.createElement("small");l.textContent=t[0]=="wifi"?netLine():t[0]=="bt"?btLine():t[2];k.append(i,l);if(t[0]=="wifi"||t[0]=="bt"){const cv=document.createElement("span");cv.className="cv";cv.textContent="›";cv.title="Show "+t[2]+" list";cv.onclick=e=>{e.stopPropagation();showFly(t[0])};k.append(cv);k.oncontextmenu=e=>{e.preventDefault();showFly(t[0])}}k.setAttribute("aria-pressed",on);
 k.onclick=()=>{const id=t[0];if(id=="set"){ac.classList.remove("open");open("set");return}
  if(id=="dark"){store.set("webos-theme",isDark()?"light":"dark");theme()}
  else if(id=="air"){SYS.air=SYS.air?0:1;if(SYS.air){SYS.wifi=0;SYS.bt=0}else{SYS.wifi=1;SYS.bt=1}}
  else{if(SYS.air&&(id=="wifi"||id=="bt"))return;SYS[id]=SYS[id]?0:1}
  saveQ();apply();rq();trayUpd()};q.append(k)})};
const apply=()=>{warm.style.opacity=SYS.night?1:0};
const rn=()=>{const l=$id("nl");l.innerHTML="";if(!NT.length){l.innerHTML='<p class="ne">No new notifications</p>'}
 NT.forEach((n,i)=>{const d=document.createElement("div");d.className="nt2";const h=document.createElement("b");h.textContent=n.t;const x=document.createElement("span");x.textContent=n.x;const tm=document.createElement("small");tm.textContent=n.at.toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});const c=document.createElement("button");c.textContent="×";c.title="Dismiss";c.onclick=()=>{NT.splice(i,1);rn()};d.append(h,x,tm,c);l.append(d)});
 const bd=$id("nb");bd.textContent=sysUnread||"";bd.style.display=sysUnread?"flex":"none"};
window.notify=function(title,text){NT.unshift({t:title,x:text,at:new Date()});if(acOpen()){}else sysUnread++;rn();if(SYS.dnd||acOpen())return;
 const t=document.createElement("div");t.className="toast";const h=document.createElement("b");h.textContent=title;const x=document.createElement("span");x.textContent=text;t.append(h,x);toasts.append(t);const gone=()=>t.remove();t.onclick=gone;setTimeout(gone,4500)};
$id("acl").onclick=()=>{NT.length=0;sysUnread=0;rn()};
const toggle=()=>{const o=!acOpen();ac.classList.toggle("open",o);if(o){document.getElementById("start").classList.remove("open");sysUnread=0;fly.classList.remove("open");rn();rq()}};
$id("nbtn").onclick=e=>{e.stopPropagation();toggle()};["tw","tv","tb2"].forEach(i=>$id(i).onclick=e=>{e.stopPropagation();toggle()});
document.getElementById("desk").addEventListener("pointerdown",()=>ac.classList.remove("open"));
$id("sb").addEventListener("click",()=>ac.classList.remove("open"));
addEventListener("keydown",e=>{if(e.key=="Escape")ac.classList.remove("open")});
const br=$id("br"),vl=$id("vl");
br.value=store.get("webos-bright","100");vl.value=store.get("webos-volume","100");
const setB=()=>{dim.style.opacity=(100-br.value)/100*.7;store.set("webos-bright",br.value)};
const setV=()=>{sysVol=vl.value/100;store.set("webos-volume",vl.value);document.dispatchEvent(new Event("webos-vol"));trayUpd()};
br.oninput=setB;vl.oninput=setV;setB();setV();
addEventListener("online",()=>{trayUpd();rq();notify("Network","Back online")});addEventListener("offline",()=>{trayUpd();rq();notify("Network","You're offline")});
const lc=document.querySelector("#lock .lc");if(lc){const lu=document.createElement("div");lu.className="lu";lc.append(lu)}
apply();rq();trayUpd();rn();
})();
applyWall();applyAcc();applyUser();
</script>
